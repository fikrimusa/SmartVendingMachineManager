name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish SmartVendingMachineManager/SmartVendingMachineManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip artifact
        run: Compress-Archive -Path publish\* -DestinationPath SmartVendingMachineManager.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SmartVendingMachineManager.zip
          generate_release_notes: true
